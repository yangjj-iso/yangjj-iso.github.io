<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" width="760" height="426">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .halo { paint-order: stroke; stroke: #fbfbfb; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 9 5 1 8.5z" fill="#8a949b"/>
    </marker>
    <marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 9 5 1 8.5z" fill="#2d72d9"/>
    </marker>
  </defs>
  <rect x="584" y="20" width="166" height="58" rx="8" fill="#eef4fc" stroke="#c9dbf4"/>
  <text x="600" y="45" font-size="15" fill="#2d72d9" font-weight="700">Apache 2.0</text>
  <text x="600" y="65" font-size="12.5" fill="#4a535a">宽松，附专利授权</text>
  <rect x="584" y="92" width="166" height="58" rx="8" fill="#eef4fc" stroke="#c9dbf4"/>
  <text x="600" y="117" font-size="15" fill="#2d72d9" font-weight="700">MIT / BSD</text>
  <text x="600" y="137" font-size="12.5" fill="#4a535a">宽松，只需保留署名</text>
  <rect x="584" y="164" width="166" height="58" rx="8" fill="#fdf3ea" stroke="#f1d6bd"/>
  <text x="600" y="189" font-size="15" fill="#c06a1c" font-weight="700">AGPL v3</text>
  <text x="600" y="209" font-size="12.5" fill="#4a535a">网络服务也要开源</text>
  <rect x="584" y="236" width="166" height="58" rx="8" fill="#fdf3ea" stroke="#f1d6bd"/>
  <text x="600" y="261" font-size="15" fill="#c06a1c" font-weight="700">LGPL / MPL 2.0</text>
  <text x="600" y="281" font-size="12.5" fill="#4a535a">只管这个库本身</text>
  <rect x="584" y="308" width="166" height="58" rx="8" fill="#fdf3ea" stroke="#f1d6bd"/>
  <text x="600" y="333" font-size="15" fill="#c06a1c" font-weight="700">GPL v3</text>
  <text x="600" y="353" font-size="12.5" fill="#4a535a">衍生作品整体开源</text>
  <rect x="10" y="135.0" width="124" height="62" rx="8" fill="#ffffff" stroke="#b9c1c7" stroke-width="1.5"/>
  <text x="72.0" y="161.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">允许别人闭源</text>
  <text x="72.0" y="181.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">商用吗？</text>
  <rect x="206" y="54.0" width="124" height="62" rx="8" fill="#ffffff" stroke="#b9c1c7" stroke-width="1.5"/>
  <text x="268.0" y="80.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">需要明确的</text>
  <text x="268.0" y="100.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">专利授权？</text>
  <rect x="206" y="216.0" width="124" height="62" rx="8" fill="#ffffff" stroke="#b9c1c7" stroke-width="1.5"/>
  <text x="268.0" y="242.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">网络服务也</text>
  <text x="268.0" y="262.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">要开源吗？</text>
  <rect x="400" y="270.0" width="124" height="62" rx="8" fill="#ffffff" stroke="#b9c1c7" stroke-width="1.5"/>
  <text x="462.0" y="296.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">只约束这个</text>
  <text x="462.0" y="316.0" font-size="13.5" fill="#2c343c" font-weight="600" text-anchor="middle">库本身？</text>
  <path d="M134 166.0 H156 V85.0 H204" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="164" y="78.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">允许</text>
  <path d="M134 166.0 H156 V247.0 H204" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="164" y="240.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">不允许</text>
  <path d="M330 85.0 H352 V49.0 H582" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="42.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">是</text>
  <path d="M330 85.0 H352 V121.0 H582" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="114.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">否</text>
  <path d="M330 247.0 H352 V193.0 H582" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="186.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">是</text>
  <path d="M330 247.0 H352 V301.0 H398" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="360" y="294.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">否</text>
  <path d="M524 301.0 H546 V265.0 H582" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="554" y="258.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">是</text>
  <path d="M524 301.0 H546 V337.0 H582" fill="none" stroke="#8a949b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="554" y="330.0" font-size="12.5" fill="#8a949b" font-weight="600" class="halo">否</text>
  <rect x="14" y="394" width="14" height="14" rx="3" fill="#eef4fc" stroke="#c9dbf4"/>
  <text x="36" y="406" font-size="13" fill="#4a535a">宽松型 Permissive</text>
  <rect x="184" y="394" width="14" height="14" rx="3" fill="#fdf3ea" stroke="#f1d6bd"/>
  <text x="206" y="406" font-size="13" fill="#4a535a">传染型 Copyleft</text>
</svg>
