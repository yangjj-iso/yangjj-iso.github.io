<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowTree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="16" fill="url(#bgGrad4)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">常见开源许可证选型决策树 (Open Source License Decision Guide)</text>
    <text x="40" y="66" font-size="13" fill="#64748b">根据对商业化自由度、专利授权和衍生代码传染性的诉求快速定型</text>
  </g>

  <!-- Root Question -->
  <g transform="translate(40, 95)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="780" height="46" rx="8" fill="#1e293b"/>
    <text x="390" y="28" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">核心问题：是否允许他人将你的代码闭源、修改并用于商业分发？</text>
  </g>

  <!-- Left Branch: 宽松型 Permissive -->
  <path d="M 235 141 L 235 175" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowTree)"/>
  <g transform="translate(40, 180)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="380" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="190" y="25" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">允许（宽松型许可证 Permissive）</text>
  </g>

  <!-- Left Choices -->
  <g transform="translate(40, 235)" font-family="system-ui, -apple-system, sans-serif">
    <!-- MIT Card -->
    <rect x="0" y="0" width="380" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="10" width="54" height="22" rx="4" fill="#eff6ff"/>
    <text x="39" y="25" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">MIT</text>
    <text x="76" y="26" font-size="13" font-weight="700" fill="#0f172a">极简自由 · 社区最通用</text>
    <text x="14" y="48" font-size="11" fill="#64748b">只要求保留作者署名与免责声明，无其他苛刻条件 (React, Vue, Node.js 首选)</text>

    <!-- Apache 2.0 Card -->
    <rect x="0" y="76" width="380" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="86" width="76" height="22" rx="4" fill="#eff6ff"/>
    <text x="50" y="101" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">Apache 2.0</text>
    <text x="98" y="102" font-size="13" font-weight="700" fill="#0f172a">专利保护 · 企业与云原生首选</text>
    <text x="14" y="124" font-size="11" fill="#64748b">包含显式专利授权与商标防滥用条款，大型框架与企业项目标配 (Kubernetes, Rust)</text>

    <!-- BSD Card -->
    <rect x="0" y="152" width="380" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">BSD 2-Clause / 3-Clause</text>
    <text x="14" y="42" font-size="11" fill="#64748b">类似 MIT，额外禁止利用项目及作者名义做无授权商业背书</text>
  </g>

  <!-- Right Branch: 传染型 Copyleft -->
  <path d="M 625 141 L 625 175" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrowTree)"/>
  <g transform="translate(440, 180)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="380" height="40" rx="8" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="190" y="25" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">要求衍生代码必须同样开源（传染型 Copyleft）</text>
  </g>

  <!-- Right Choices -->
  <g transform="translate(440, 235)" font-family="system-ui, -apple-system, sans-serif">
    <!-- GPL v3 Card -->
    <rect x="0" y="0" width="380" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="10" width="58" height="22" rx="4" fill="#fff1f2"/>
    <text x="41" y="25" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">GPL v3</text>
    <text x="80" y="26" font-size="13" font-weight="700" fill="#0f172a">强传染 · 捍卫自由开源</text>
    <text x="14" y="48" font-size="11" fill="#64748b">任何基于该代码修改或集成的软件分发时必须完全开源 (Linux, Git)</text>

    <!-- AGPL v3 Card -->
    <rect x="0" y="76" width="380" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="12" y="86" width="68" height="22" rx="4" fill="#fff1f2"/>
    <text x="46" y="101" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">AGPL v3</text>
    <text x="90" y="102" font-size="13" font-weight="700" fill="#0f172a">云端防白嫖 · SaaS 开源首选</text>
    <text x="14" y="124" font-size="11" fill="#64748b">弥补 GPL 漏洞，只要通过网络向用户提供云服务，修改的服务端代码也必须开源</text>

    <!-- LGPL / MPL Card -->
    <rect x="0" y="152" width="380" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="24" font-size="12" font-weight="700" fill="#0f172a">LGPL v3 / MPL 2.0 (弱传染型)</text>
    <text x="14" y="42" font-size="11" fill="#64748b">仅对修改本库本身的源码强制开源，主工程动态链接时可闭源商用</text>
  </g>
</svg>
