<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .halo { paint-order: stroke; stroke: #fbfbfb; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 9 5 1 8.5z" fill="#8a949b"/>
    </marker>
    <marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.5 9 5 1 8.5z" fill="#2d72d9"/>
    </marker>
  </defs>
  <rect x="30" y="24" width="250" height="104" rx="10" fill="#ffffff" stroke="#d9dee2" stroke-width="1.5"/>
  <text x="50" y="58" font-size="18" fill="#2c343c" font-weight="700">Upstream</text>
  <text x="50" y="82" font-size="13" fill="#4a535a">官方仓库 · 你只能读</text>
  <text x="50" y="108" font-size="12.5" fill="#8a949b" class="mono">original-owner/cool-project</text>
  <rect x="480" y="24" width="250" height="104" rx="10" fill="#ffffff" stroke="#d9dee2" stroke-width="1.5"/>
  <text x="500" y="58" font-size="18" fill="#2c343c" font-weight="700">Origin</text>
  <text x="500" y="82" font-size="13" fill="#4a535a">你的 Fork · 可以读写</text>
  <text x="500" y="108" font-size="12.5" fill="#8a949b" class="mono">yangjj-iso/cool-project</text>
  <rect x="255" y="276" width="250" height="104" rx="10" fill="#ffffff" stroke="#2d72d9" stroke-width="1.5"/>
  <text x="275" y="310" font-size="18" fill="#2c343c" font-weight="700">Local</text>
  <text x="275" y="334" font-size="13" fill="#4a535a">本地工作区 · ④ 在分支上 commit</text>
  <text x="275" y="360" font-size="12.5" fill="#8a949b" class="mono">feat/add-rate-limiter</text>
  <path d="M286 62 H472" fill="none" stroke="#8a949b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ah)"/>
  <text x="379" y="52" font-size="13" fill="#8a949b" font-weight="600" text-anchor="middle" class="halo mono">① Fork</text>
  <path d="M474 100 H288" fill="none" stroke="#2d72d9" stroke-width="2" marker-end="url(#ah-accent)"/>
  <text x="381" y="124" font-size="13" fill="#2d72d9" font-weight="700" text-anchor="middle" class="halo mono">⑥ Pull Request</text>
  <path d="M640 134 L498 270" fill="none" stroke="#8a949b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="588" y="214" font-size="13" fill="#8a949b" font-weight="600" text-anchor="start" class="halo mono">② git clone</text>
  <path d="M470 270 L612 134" fill="none" stroke="#8a949b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="524" y="194" font-size="13" fill="#8a949b" font-weight="600" text-anchor="end" class="halo mono">⑤ git push</text>
  <path d="M150 134 L282 270" fill="none" stroke="#8a949b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="196" y="214" font-size="13" fill="#8a949b" font-weight="600" text-anchor="end" class="halo mono">③ fetch + rebase</text>
</svg>
