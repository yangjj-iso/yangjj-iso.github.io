<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="560" rx="16" fill="url(#bgGrad2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <text x="36" y="38" font-size="20" font-weight="700" fill="#0f172a">GitHub 协同标准闭环 (Fork &amp; Pull Request Workflow)</text>
    <text x="36" y="60" font-size="13" fill="#64748b">三层仓库空间拓扑与标准交互链路：Upstream ⇄ Origin ⇄ Local</text>
  </g>

  <!-- 3 Repository Domains / Areas -->
  <!-- 1. Upstream Domain -->
  <g transform="translate(36, 85)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="370" height="185" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="370" height="36" rx="12" fill="#f8fafc"/>
    <path d="M 0 36 L 370 36" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <text x="36" y="23" font-size="13" font-weight="700" fill="#334155">Upstream 官方仓库 (github.com/organization/project)</text>

    <!-- Branch in Upstream -->
    <rect x="24" y="55" width="322" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="40" y="80" font-size="13" font-weight="600" fill="#1e293b">分支: main (受保护主分支，不可直接推入)</text>

    <!-- Actions / Reviews in Upstream -->
    <rect x="24" y="112" width="322" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="134" font-size="12" font-weight="600" fill="#0f172a">CI 自动化检查 (Lint, Test, Build)</text>
    <text x="40" y="152" font-size="11" fill="#64748b">+ Maintainer 严格审阅 (Review &amp; Approve)</text>
  </g>

  <!-- 2. Origin Domain -->
  <g transform="translate(454, 85)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="370" height="185" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="370" height="36" rx="12" fill="#f8fafc"/>
    <path d="M 0 36 L 370 36" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#3b82f6"/>
    <text x="36" y="23" font-size="13" font-weight="700" fill="#334155">Origin 个人 Fork (github.com/yangjj-iso/project)</text>

    <!-- Branch in Origin -->
    <rect x="24" y="55" width="322" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="40" y="80" font-size="13" font-weight="600" fill="#1e40af">分支: feat-my-feature (特性开发分支)</text>

    <rect x="24" y="112" width="322" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="134" font-size="12" font-weight="600" fill="#0f172a">个人云端备份与 PR 发起源</text>
    <text x="40" y="152" font-size="11" fill="#64748b">拥有全部写权限，可随时安全 Force Push</text>
  </g>

  <!-- 3. Local Workspace Domain -->
  <g transform="translate(36, 310)" font-family="system-ui, -apple-system, sans-serif">
    <rect width="788" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="788" height="36" rx="12" fill="#f8fafc"/>
    <path d="M 0 36 L 788 36" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#10b981"/>
    <text x="36" y="23" font-size="13" font-weight="700" fill="#334155">Local 本地开发机 (开发、测试、分支演进与基线重整)</text>

    <!-- 3 blocks in Local -->
    <!-- Block A -->
    <rect x="20" y="52" width="236" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="74" font-size="12" font-weight="700" fill="#0f172a">① 配置上游源 Remote</text>
    <text x="32" y="94" font-size="11" font-family="monospace" fill="#0284c7">git remote add upstream</text>
    <text x="32" y="110" font-size="11" font-family="monospace" fill="#0284c7">  https://github.com/...</text>
    <text x="32" y="132" font-size="11" fill="#64748b">保证可随时同步上游最新主干</text>
    <text x="32" y="148" font-size="11" fill="#64748b">避免代码过时产生庞大冲突</text>

    <!-- Block B -->
    <rect x="276" y="52" width="236" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="288" y="74" font-size="12" font-weight="700" fill="#0f172a">② 切特性分支开发</text>
    <text x="288" y="94" font-size="11" font-family="monospace" fill="#0284c7">git checkout -b feat-xxx</text>
    <text x="288" y="112" font-size="11" fill="#64748b">• 保持代码修改聚焦最小范围</text>
    <text x="288" y="128" font-size="11" fill="#64748b">• 规范 commit: feat / fix / docs</text>
    <text x="288" y="146" font-size="11" fill="#64748b">• 本地跑通单元测试与 Lint</text>

    <!-- Block C -->
    <rect x="532" y="52" width="236" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="544" y="74" font-size="12" font-weight="700" fill="#0f172a">③ 变基同步与提交流水</text>
    <text x="544" y="94" font-size="11" font-family="monospace" fill="#0284c7">git fetch upstream</text>
    <text x="544" y="110" font-size="11" font-family="monospace" fill="#0284c7">git rebase upstream/main</text>
    <text x="544" y="128" font-size="11" font-family="monospace" fill="#0284c7">git push -u origin feat-xxx</text>
    <text x="544" y="148" font-size="11" fill="#64748b">提交历史保持干净线性</text>
  </g>

  <!-- Interactive Arrows between Domains -->
  <!-- Fork Arrow: Upstream -> Origin -->
  <path d="M 406 130 L 454 130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="430" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Fork</text>

  <!-- Push Arrow: Local -> Origin -->
  <path d="M 650 310 L 650 270" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="660" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#2563eb">Push</text>

  <!-- PR Arrow: Origin -> Upstream -->
  <path d="M 454 210 L 406 210" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">PR</text>

  <!-- Sync Arrow: Upstream -> Local -->
  <path d="M 138 270 L 138 310" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowSlate)"/>
  <text x="146" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Fetch / Sync</text>

  <!-- Bottom Tip -->
  <g transform="translate(36, 504)" font-family="system-ui, -apple-system, sans-serif">
    <text x="8" y="16" font-size="12" fill="#64748b">📌 关键要点：永远不要直接在本地的 main 分支写代码；提交 PR 前务必基于 upstream/main 进行 rebase；一次 PR 只解决一个明确问题。</text>
  </g>
</svg>
